name: CI

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]

permissions:
    contents: read

concurrency:
    group:  ci-${{ github.ref}}
    cancel-in-progress: true

jobs:
    check:
        name: Lint, tipos y tests
        runs-on: ubuntu-24.04
        timeout-minutes: 10

        steps:
            - name: Descargar el codigo
              uses:  actions/checkout@v7

            - name: Instalar uv
              uses: astral-sh/setup-uv@v10.2.0
              with:
                enable-cache: true

            - name: Instalar just
              uses: extractions/setup-just@v4

            - name: Instalar dependencias
              run: uv sync --locked

            - name: Lint, tipos y tests
              run: just check
