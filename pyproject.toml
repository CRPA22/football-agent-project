[project]
name = "football-agent"
version = "0.1.0"
description = "Agente conversacional de fútbol con tools (RAG, API y cálculo) desplegado en Azure"
readme = "README.md"
authors = [
    { name = "christianpovis", email = "163607405+CRPA22@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
football-agent = "football_agent:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: errores y estilo básico
    "F",        # pyflakes: variables sin usar, imports rotos
    "I",        # isort: orden de los imports
    "B",        # bugbear: patrones que suelen ser bugs
    "UP",       # pyupgrade: sintaxis moderna de Python
    "SIM",      # simplificaciones de código
    "N",        # convenciones de nombres (PEP 8)
    "S",        # bandit: problemas de seguridad
    "ASYNC",    # errores comunes en código async
    "RUF",      # reglas propias de ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # en tests, assert es lo normal

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
